              oMenu.style.fontSize = fontSize;
          } else {
              for (pageid in mainmenulist) {
                  SetLabelTitle(g_dom.GetFirstChildByTag($(pageid), "label"));
              }
          }
          function SetLabelTitle(elem)
          {
              if (!elem || elem.parentNode.offsetWidth > elem.offsetWidth) return;
              $attr(elem, "title", $value(elem));
          }
          function SetFontSize (elem) {
              if (!elem || elem.parentNode.offsetWidth > elem.offsetWidth) return;
              var size = 15;
              while (--size) {
                  fontSize = size + "px";
                  elem.style.fontSize = fontSize;
                  if (size < 12 && g_broswer.GetChromeVersion()) {
                      var scale = size / 12;
                      elem.style.webkitTransform = "scale(" + scale + ")";
                      if (elem.parentNode.offsetWidth > elem.offsetWidth * scale) {
                          elem.style.webkitTransform = "scale(" + Math.floor(scale * 100) / 100 + ")";
                          elem.style.display = "block";
                          break;
                      }
                  }
                  else {
                      if (elem.parentNode.offsetWidth > elem.offsetWidth) break;
                  }
              }
